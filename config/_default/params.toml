mainSections   = ["post", "computer", "other"]
rssFullContent = true
favicon        = "img/Site.png"

[footer]
    since = 2020

[sidebar]
    emoji    = "✏️"
    subtitle = "一个有趣的灵魂"
    avatar   = "img/Profile.png"

[article]
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "TauQ1u/my_blog"
        repoID           = "在此填入repoID"
        category         = "General"
        categoryID       = "在此填入categoryID"
        mapping          = "title"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lang             = "zh-CN"
        strict           = 0
        loading          = "lazy"

# GDPR Cookie Consent Configuration
# When enabled, analytics and functional cookies require user consent
[cookies]
    enabled = false

    [cookies.categories]
        analytics  = true
        functional = true
