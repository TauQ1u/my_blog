baseURL                = "https://tauq1u.github.io/my_blog/"
locale                 = "zh-CN"
title                  = "TauQ1u的博客"
# Theme i18n support
# See i18n folder for available languages
defaultContentLanguage = "zh"
# Set hasCJKLanguage to true if DefaultContentLanguage is a CJK language
# This will make .Summary and .WordCount behave correctly
hasCJKLanguage         = true
# 站点只有简体中文一种语言，直接使用站点根路径（/my_blog/），不再放入 /zh/ 子目录
defaultContentLanguageInSubdir = false

theme = "hugo-theme-stack"

enableGitInfo = true

# 让 Hugo 自动生成 robots.txt，方便搜索引擎抓取
enableRobotsTXT = true

[pagination]
    pagerSize = 3

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[frontmatter]
    lastmod = ["lastmod", ":git", ":fileModTime"]

# 板块：计算机 / 其他；方向统一用标签（tags）呈现
[taxonomies]
    tag = "tags"